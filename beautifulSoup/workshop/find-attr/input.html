<!DOCTYPE html>
<html>
<head>
    <title>時間顯示</title>
</head>
<body>
    <div id="container">
        <p>Paragraph 1</p>

        <div class="content">
            <p>Paragraph 2</p>
            <div data-role="time">
                <p>21:00</p>
            </div>
            <p>Paragraph 3</p>
        </div>

        <div class="label">
            <p>台灣時間：</p>
        </div>
    </div>
</body>
</html>
